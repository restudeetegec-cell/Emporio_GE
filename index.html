<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporio GE</title> 
    
    <link rel="stylesheet" href="style/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="images/logo.png" type="image/png">
</head>

<body background="images/fundo.png">
    <header>
        <!--PARTE DA LOGO + MENU (AINDA EM DESENVOLVIMENTO) -->
    </header>

    <main>
        <!--OFERTAS-->
        <section id="ofertas">
        
        <h1>OFERTAS</h1>
            <p>Ofertas especiais semanais. <strong>Não perca!</strong></p>

            <div class="carrossel">
                
                <div class="oferta">
                    <img src="/images/tilapia.jpg" alt="Tilápia">
                    <h3>Tilápia</h3>
                    <p>R$ 22,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="images/Sardinha.jpg" alt="Sardinha">
                    <h3>Sardinha</h3>
                    <p>R$ 12,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/fileti.webp" alt="Filé Tilápia">
                    <h3>Filé Tilápia</h3>
                    <p>R$ 24,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/atum.jpg" alt="Atum">
                    <h3>Atum</h3>
                    <p>R$ 32,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/Corvina.webp" alt="Corvina">
                    <h3>Corvina</h3>
                    <p>R$ 23,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

            </div>
        </section>

        <!--CATÁLOGO-->
        <section id="catalogo">
            
            <h2>Catálogo</h2>
            <p>Confira nossos produtos.</p>

            <br>

            <!--produtos-->

            <div class="container-geral">

                <!-- Primeiro Peixe -->

                <div class="produtos">
                    <span class="item-nome">Tilápia</span>
                    <span class="item-preco">R$ 28,00</span>
                </div>
            
                <!-- Segundo Peixe -->
                <div class="produtos">
                    <span class="item-nome">Sardinha</span>
                    <span class="item-preco">R$ 15,00</span>
                </div>
            
                <!-- Terceiro Peixe -->
                <div class="produtos">
                    <span class="item-nome">Filé de Tilápia</span>
                    <span class="item-preco">R$ 30,00</span>
                </div>

                <div class="produtos">
                    <span class="item-nome">Atum</span>
                    <span class="item-preco">R$ 36,00</span>
                </div>
            
                <!-- Segundo Peixe -->
                <div class="produtos">
                    <span class="item-nome">Corvina</span>
                    <span class="item-preco">R$ 25,00</span>
                </div>
            
                <!-- Terceiro Peixe -->
                <div class="produtos">
                    <span class="item-nome">Peixe Palhaço</span>
                    <span class="item-preco">R$ 50,00</span>
                </div>
            
            </div>

        </section>

        <!--outras seções futuramente-->

    </main>


    <footer>
        <!--Informações do Empório GE-->
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
