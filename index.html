<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporio GE</title> 
    <link rel="stylesheet" href="/style/style.css">
</head>

<body>
    <header>
        <!--PARTE DA LOGO + MENU (AINDA EM DESENVOLVIMENTO) -->
    </header>

    <main>

        <!--OFERTAS-->
        <section id="ofertas">

        <h1>Ofertas</h1>
            <p>Ofertas especiais semanais. <strong>Não perca!</strong></p>

            <div class="carrossel">
                
                <div class="oferta">
                    <img src="/images/atum.jpg" alt="Tilápia">
                    <h3>Tilápia</h3>
                    <p>R$ 22,00</p>
                    <button>Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/atum.jpg" alt="Sardinha">
                    <h3>Sardinha</h3>
                    <p>R$ 12,00</p>
                    <button>Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/atum.jpg" alt="Filé Tilápia">
                    <h3>Filé Tilápia</h3>
                    <p>R$ 2,00</p>
                    <button>Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/atum.jpg" alt="Atum">
                    <h3>Atum</h3>
                    <p>R$ 32,00</p>
                    <button>Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/atum.jpg" alt="Corvina">
                    <h3>Corvina</h3>
                    <p>R$ 23,00</p>
                    <button>Ver oferta</button>
                </div>

            </div>
        </section>


        <!--CATÁLOGO-->
        <section id="catalogo">
            
            <h2>Catálogo</h2>
            <p>Confira nossos produtos.</p>

            <div class="produtos">
                <!--produtos-->
            </div>
        </section>

        <!--outras seções futuramente-->

    </main>


    <footer>
        <!--Informações do Empório GE-->
    </footer>

</body>


<script src="/js/script.js"></script>
</html>
