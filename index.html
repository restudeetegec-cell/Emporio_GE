<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emporio GE</title> 
    <link rel="stylesheet" href="/style/style.css">
</head>

<body background="images/fundo.png">
    <header>
        <!--PARTE DA LOGO + MENU (AINDA EM DESENVOLVIMENTO) -->

    <main>
        <!--OFERTAS-->
        <section id="ofertas">
        
        <h1>OFERTAS</h1>
            <p>Ofertas especiais semanais. <strong>Não perca!</strong></p>

            <div class="carrossel">
                
                <div class="oferta">
                    <img src="/images/tilapia.jpg" alt="Tilápia">
                    <h3>Tilápia</h3>
                    <p>R$ 22,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="images/Sardinha.jpg" alt="Sardinha">
                    <h3>Sardinha</h3>
                    <p>R$ 12,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/fileti.webp" alt="Filé Tilápia">
                    <h3>Filé Tilápia</h3>
                    <p>R$ 2,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/atum.jpg" alt="Atum">
                    <h3>Atum</h3>
                    <p>R$ 32,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

                <div class="oferta">
                    <img src="/images/Corvina.webp" alt="Corvina">
                    <h3>Corvina</h3>
                    <p>R$ 23,00</p>
                    <button class = "btt">Ver oferta</button>
                </div>

            </div>
        </section>

        <!--CATÁLOGO-->
        <section id="catalogo">
            
            <h2>Catálogo</h2>
            <p>Confira nossos produtos.</p>

            <div class="produtos">
                <!--produtos-->
            </div>

        <!--outras seções futuramente-->

    <footer>
        <!--Informações do Empório GE-->
    </footer>
